<!DOCTYPE html>
<html>
<head>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
    }

    .buddy-wrap {
        width: 100%;
        height: 200px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 15px;
        cursor: pointer;
        user-select: none;
    }

    .buddy {
        position: relative;
        width: 80px;
        height: 80px;
        border-radius: 18px;
        background: radial-gradient(circle at 35% 30%, #1a2a33, #0a1218 70%);
        border: 2px solid rgba(0, 229, 255, 0.5);
        box-shadow:
            0 0 14px rgba(0, 229, 255, 0.35),
            inset 0 0 12px rgba(0, 229, 255, 0.15);
        animation: idleBob 2.6s ease-in-out infinite;
        transition: transform 0.05s ease-out, box-shadow 0.15s ease-out, border-color 0.15s ease-out;
    }

    @keyframes idleBob {
        0%, 100% { transform: translateY(0) scale(1); }
        50%      { transform: translateY(-4px) scale(1.015); }
    }

    .eye {
        position: absolute;
        top: 30px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00e5ff;
        box-shadow: 0 0 6px rgba(0, 229, 255, 0.9);
        transition: transform 0.08s ease, height 0.08s ease;
    }
    .eye.left  { left: 22px; }
    .eye.right { right: 22px; }

    /* smiling mouth (idle) — arc made from a bottom-border curve */
    .mouth {
        position: absolute;
        bottom: 20px;
        left: 50%;
        width: 22px;
        height: 11px;
        margin-left: -11px;
        border: 2px solid transparent;
        border-bottom-color: #00e5ff;
        border-radius: 50%;
        transition: transform 0.15s ease, border-bottom-color 0.15s ease;
    }

    /* sad mouth — flipped arc, shown only while hit */
    .buddy.hit .mouth {
        transform: scaleY(-1) translateY(2px);
        border-bottom-color: #ff4d5e;
    }

    /* --- hit reaction --- */
    .buddy.hit {
        animation: none;
        transform: scale(0.82, 1.12) rotate(var(--tilt, -6deg));
        border-color: #ff4d5e;
        box-shadow:
            0 0 22px rgba(255, 77, 94, 0.6),
            inset 0 0 14px rgba(255, 77, 94, 0.25);
    }

    .buddy.hit .eye {
        height: 2px;
        transform: translateY(3px);
        background: #ff4d5e;
        box-shadow: 0 0 6px rgba(255, 77, 94, 0.9);
    }

    /* small "impact" ring that pops out on click */
    .impact {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        margin: -10px 0 0 -10px;
        border-radius: 6px;
        border: 2px solid rgba(255, 77, 94, 0.8);
        opacity: 0;
        pointer-events: none;
    }

    .impact.play {
        animation: impactPop 0.35s ease-out forwards;
    }

    @keyframes impactPop {
        0%   { opacity: 0.9; transform: scale(0.3); }
        100% { opacity: 0;   transform: scale(2.6); }
    }
</style>
</head>
<body>

    <div class="buddy-wrap" id="buddyWrap">
        <div class="buddy" id="buddy">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth" id="mouth"></div>
            <div class="impact" id="impact"></div>
        </div>
    </div>

<script>
    const buddy = document.getElementById("buddy");
    const wrap = document.getElementById("buddyWrap");
    const impact = document.getElementById("impact");
    const eyeL = document.querySelector(".eye.left");
    const eyeR = document.querySelector(".eye.right");
    let resetTimer = null;
    let isHit = false;

    const LEAN_MAX = 45;  // px the whole buddy can shift toward the cursor
    const EYE_MAX = 3;    // px the pupils can shift within the face

    function trackCursor(clientX, clientY) {
        if (isHit) return; // don't fight the hit animation

        const rect = buddy.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        const dx = clientX - cx;
        const dy = clientY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;

        const leanX = (dx / dist) * Math.min(dist, LEAN_MAX);
        const leanY = (dy / dist) * Math.min(dist, LEAN_MAX);
        buddy.style.transform = `translate(${leanX.toFixed(1)}px, ${leanY.toFixed(1)}px)`;

        const eyeX = (dx / dist) * Math.min(dist, EYE_MAX);
        const eyeY = (dy / dist) * Math.min(dist, EYE_MAX);
        [eyeL, eyeR].forEach(eye => {
            eye.style.transform = `translate(${eyeX.toFixed(1)}px, ${eyeY.toFixed(1)}px)`;
        });
    }

    function attachTracking(doc) {
        doc.addEventListener("mousemove", (e) => trackCursor(e.clientX, e.clientY));
    }

    try {
        attachTracking(window.parent.document);
    } catch (err) {
        attachTracking(document);
    }
    attachTracking(document); // safety net inside the iframe too

    function playHit(fromLeft) {
        isHit = true;
        buddy.style.setProperty("--tilt", fromLeft ? "-8deg" : "8deg");
        buddy.classList.add("hit");
        impact.classList.remove("play");
        void impact.offsetWidth; // restart animation
        impact.classList.add("play");

        clearTimeout(resetTimer);
        resetTimer = setTimeout(() => {
            buddy.classList.remove("hit");
            isHit = false;
        }, 220);
    }

    // left click
    wrap.addEventListener("click", (e) => {
        const rect = wrap.getBoundingClientRect();
        const fromLeft = (e.clientX - rect.left) < rect.width / 2;
        playHit(fromLeft);
    });

    // right click — same reaction, no context menu
    wrap.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        const rect = wrap.getBoundingClientRect();
        const fromLeft = (e.clientX - rect.left) < rect.width / 2;
        playHit(!fromLeft);
    });
</script>

</body>
</html>
