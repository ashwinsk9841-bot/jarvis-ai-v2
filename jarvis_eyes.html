<!DOCTYPE html>
<html>
<head>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
    }

    .eye-wrap {
        display: flex;
        gap: 60px;
        align-items: center;
        justify-content: center;
        height: 160px;
    }

    .eye {
        position: relative;
        width: 70px;
        height: 70px;
    }

    .ring {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 50%;
        border: 2px solid rgba(0, 229, 255, 0.35);
        border-top-color: #00e5ff;
        animation: spin 3.2s linear infinite;
    }

    .ring.reverse {
        top: 8px; left: 8px; right: 8px; bottom: 8px;
        border-color: rgba(0, 229, 255, 0.2);
        border-bottom-color: #00e5ff;
        animation: spin 2.1s linear infinite reverse;
    }

    /* pupil — plain visible circle, no nested clipping wrapper */
    .core {
        position: absolute;
        top: 22px;
        left: 22px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background-color: #00e5ff;
        background-image: radial-gradient(circle at 35% 35%, #ffffff, #00e5ff 45%, #0a5a6b 100%);
        box-shadow:
            0 0 10px 2px rgba(0, 229, 255, 0.9),
            0 0 24px 4px rgba(0, 229, 255, 0.5);
        transition: transform 0.05s linear;
        transform-origin: center;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .label {
        position: absolute;
        bottom: -22px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'JetBrains Mono', 'Consolas', monospace;
        font-size: 10px;
        letter-spacing: 2px;
        color: rgba(0, 229, 255, 0.6);
        white-space: nowrap;
    }
</style>
</head>
<body>

    <div class="eye-wrap">
        <div class="eye" id="eyeL">
            <div class="ring"></div>
            <div class="ring reverse"></div>
            <div class="core" id="coreL"></div>
            <div class="label">L-OPT</div>
        </div>
        <div class="eye" id="eyeR">
            <div class="ring"></div>
            <div class="ring reverse"></div>
            <div class="core" id="coreR"></div>
            <div class="label">R-OPT</div>
        </div>
    </div>

<script>
    const eyes = [
        { eye: document.getElementById("eyeL"), core: document.getElementById("coreL") },
        { eye: document.getElementById("eyeR"), core: document.getElementById("coreR") }
    ];

    const MAX_OFFSET = 9;

    function updateEyes(clientX, clientY) {
        eyes.forEach(({ eye, core }) => {
            const rect = eye.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            const dx = clientX - cx;
            const dy = clientY - cy;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;

            // unit direction vector, scaled to at most MAX_OFFSET px
            const travel = Math.min(dist, MAX_OFFSET);
            const offsetX = (dx / dist) * travel;
            const offsetY = (dy / dist) * travel;

            core.style.transform = `translate(${offsetX.toFixed(1)}px, ${offsetY.toFixed(1)}px) scaleY(1)`;
            core.dataset.tx = offsetX.toFixed(1);
            core.dataset.ty = offsetY.toFixed(1);
        });
    }

    function attachTracking(doc) {
        doc.addEventListener("mousemove", (e) => updateEyes(e.clientX, e.clientY));
    }

    try {
        attachTracking(window.parent.document);
    } catch (err) {
        attachTracking(document);
    }
    // always also track inside the iframe itself as a safety net
    attachTracking(document);

    // ---- blinking (scale the core vertically, keep its current x/y offset) ----
    const cores = [document.getElementById("coreL"), document.getElementById("coreR")];

    function blink() {
        cores.forEach(c => {
            const tx = c.dataset.tx || 0;
            const ty = c.dataset.ty || 0;
            c.style.transform = `translate(${tx}px, ${ty}px) scaleY(0.08)`;
        });
        setTimeout(() => {
            cores.forEach(c => {
                const tx = c.dataset.tx || 0;
                const ty = c.dataset.ty || 0;
                c.style.transform = `translate(${tx}px, ${ty}px) scaleY(1)`;
            });
        }, 120);

        setTimeout(blink, 2500 + Math.random() * 3500);
    }

    setTimeout(blink, 1800);
</script>

</body>
</html>
