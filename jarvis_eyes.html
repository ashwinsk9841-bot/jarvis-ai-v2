<!DOCTYPE html>
<html>
<head>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
    }

    .eye-wrap {
        display: flex;
        gap: 60px;
        align-items: center;
        justify-content: center;
        height: 160px;
    }

    .eye {
        position: relative;
        width: 70px;
        height: 70px;
    }

    /* outer rotating ring */
    .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(0, 229, 255, 0.35);
        border-top-color: #00e5ff;
        animation: spin 3.2s linear infinite;
    }

    .ring.reverse {
        inset: 8px;
        border-color: rgba(0, 229, 255, 0.2);
        border-bottom-color: #00e5ff;
        animation: spin 2.1s linear infinite reverse;
    }

    /* glowing core */
    .core {
        position: absolute;
        inset: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #7fffff, #00e5ff 55%, #0a3f4d 100%);
        box-shadow:
            0 0 12px rgba(0, 229, 255, 0.9),
            0 0 28px rgba(0, 229, 255, 0.5);
        animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1);   opacity: 1;   }
        50%      { transform: scale(0.82); opacity: 0.75; }
    }

    .label {
        position: absolute;
        bottom: -22px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'JetBrains Mono', 'Consolas', monospace;
        font-size: 10px;
        letter-spacing: 2px;
        color: rgba(0, 229, 255, 0.6);
        white-space: nowrap;
    }
</style>
</head>
<body>

    <div class="eye-wrap">
        <div class="eye">
            <div class="ring"></div>
            <div class="ring reverse"></div>
            <div class="core"></div>
            <div class="label">L-OPT</div>
        </div>
        <div class="eye">
            <div class="ring"></div>
            <div class="ring reverse"></div>
            <div class="core"></div>
            <div class="label">R-OPT</div>
        </div>
    </div>

</body>
</html>
